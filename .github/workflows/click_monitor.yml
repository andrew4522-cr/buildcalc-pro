name: BuildCalc Pro Link Click Follow-Up Monitor

on:
  schedule:
    # Check link-clickers every 2 hours to trigger +3d/+7d follow-ups
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  click_monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Poll Link Clicks & Enroll into Follow-Up Sequences
        env:
          SNOV_CLIENT_ID: ${{ secrets.SNOV_CLIENT_ID }}
          SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
        run: |
          python snov_sender.py --check-clicks

      - name: Persist Click Ledger State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/outreach/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(clicks): update clicked leads ledger [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Warning: git push deferred to local sync"
          fi
