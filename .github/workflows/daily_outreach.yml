name: BuildCalc Pro Daily Outreach Automation

on:
  schedule:
    # 08:47 Dublin/London time (07:47 UTC)
    - cron: '47 7 * * *'
    # 11:46 Dublin/London time (10:46 UTC)
    - cron: '46 10 * * *'
    # Check link-clickers every 2 hours to trigger +3d/+7d follow-ups
    - cron: '15 */2 * * *'
  workflow_dispatch:

jobs:
  outreach_batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Snov.io Outreach & Click Follow-Up Engine
        env:
          SNOV_CLIENT_ID: ${{ secrets.SNOV_CLIENT_ID || '447bad774a8d068adde2584fe3743b5a' }}
          SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET || '4ffaab2261517d434126514ab3d07bdd' }}
        run: |
          python snov_sender.py --batch-now --count 50
          python snov_sender.py --check-clicks

      - name: Persist Outreach Ledger & Queue State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/outreach/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(outreach): update dispatched leads and click ledger [skip ci]" && git push)


