name: BuildCalc Pro Daily Outreach Automation

on:
  schedule:
    # Window 1: 08:47 Dublin/London time (07:47 UTC)
    - cron: '47 7 * * *'
    # Window 2: 11:46 Dublin/London time (10:46 UTC)
    - cron: '46 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  outreach_batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Snov.io Outreach Engine (50 per account)
        env:
          SNOV_CLIENT_ID: ${{ secrets.SNOV_CLIENT_ID }}
          SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
        run: |
          python snov_sender.py --batch-now --count 50

      - name: Persist Outreach Ledger & Queue State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/outreach/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(outreach): update dispatched leads and queue state [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Warning: git push deferred to local sync"
          fi
